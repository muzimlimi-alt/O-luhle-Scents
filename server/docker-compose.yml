version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: oluhle-postgres-new
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: oluhle_scents
    ports:
      - "5435:5432"
    volumes:
      - pgdata_new:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata_new:
