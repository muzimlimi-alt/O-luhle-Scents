<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | O'luhle Scents</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/modern-extensions.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
  <script>(function(){try{var t=JSON.parse(localStorage.getItem('oluhle_admin_prefs')||'{}').theme;if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script>
</head>
<body>

  <div class="page-loader"><div class="loader-spinner"></div></div>

  <!-- Simplified Header -->
  <header class="header">
    <nav class="navbar">
      <div class="navbar__left">
        <a href="cart.html" style="font-size:0.78rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-text-light);">← Back to Cart</a>
      </div>
      <a href="index.html" class="navbar__logo">O'luhle <em>Scents</em></a>
      <div class="navbar__right">
        <div class="nav-icons">
          <a href="#" class="nav-icon" style="pointer-events:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          </a>
          <span style="font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-text-light);">Secure Checkout</span>
        </div>
      </div>
    </nav>
  </header>

  <!-- Checkout Content -->
  <section class="section" style="padding-top:120px;">
    <div class="container">
      <div class="text-center" style="margin-bottom:48px;">
        <h2>Checkout</h2>
      </div>

      <div class="checkout-grid">
        <!-- Checkout Form -->
        <div>
          <!-- Contact Info -->
          <h3 style="margin-bottom:20px;font-size:1.3rem;">Contact Information</h3>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="your@email.com">
          </div>
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="076 111 2096">
          </div>

          <!-- Shipping -->
          <h3 style="margin:32px 0 20px;font-size:1.3rem;">Shipping Address</h3>
          <div class="form-row">
            <div class="form-group">
              <label for="first-name">First Name</label>
              <input type="text" id="first-name" placeholder="First name">
            </div>
            <div class="form-group">
              <label for="last-name">Last Name</label>
              <input type="text" id="last-name" placeholder="Last name">
            </div>
          </div>
          <div class="form-group">
            <label for="address">Street Address</label>
            <input type="text" id="address" placeholder="123 Main Street">
          </div>
          <div class="form-group">
            <label for="address2">Apartment, suite, etc. (optional)</label>
            <input type="text" id="address2" placeholder="Apt 4B">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="city">City</label>
              <input type="text" id="city" placeholder="Johannesburg">
            </div>
            <div class="form-group">
              <label for="province">Province</label>
              <select id="province">
                <option value="">Select province</option>
                <option>Eastern Cape</option>
                <option>Free State</option>
                <option selected>Gauteng</option>
                <option>KwaZulu-Natal</option>
                <option>Limpopo</option>
                <option>Mpumalanga</option>
                <option>North West</option>
                <option>Northern Cape</option>
                <option>Western Cape</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="postal">Postal Code</label>
            <input type="text" id="postal" placeholder="2000" style="max-width:200px;">
          </div>          <!-- Shipping Method -->
          <h3 style="margin:32px 0 20px;font-size:1.3rem;">Shipping Method</h3>
          <div id="shipping-methods-container" style="border:1px solid var(--color-border);border-radius:var(--radius-lg);overflow:hidden;">
            <label style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;cursor:pointer;border-bottom:1px solid var(--color-border-light);background:var(--color-bg-alt);">
              <div style="display:flex;align-items:center;gap:12px;">
                <input type="radio" id="shipping-standard" name="shipping" value="99" data-name="Standard Delivery" checked style="accent-color:var(--color-gold);">
                <div>
                  <div style="font-weight:500;font-size:0.9rem;">Standard Delivery</div>
                  <div style="font-size:0.75rem;color:var(--color-text-light);">3–5 business days</div>
                </div>
              </div>
              <span class="method-price" style="font-weight:500;">R99</span>
            </label>
            <label style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;cursor:pointer;">
              <div style="display:flex;align-items:center;gap:12px;">
                <input type="radio" id="shipping-express" name="shipping" value="199" data-name="Express Delivery" style="accent-color:var(--color-gold);">
                <div>
                  <div style="font-weight:500;font-size:0.9rem;">Express Delivery</div>
                  <div style="font-size:0.75rem;color:var(--color-text-light);">1–2 business days</div>
                </div>
              </div>
              <span class="method-price" style="font-weight:500;">R199</span>
            </label>
          </div>

          <!-- Payment placeholder 
          <h3 style="margin:32px 0 20px;font-size:1.3rem;">Payment</h3>
          <div style="padding:32px;background:var(--color-bg-alt);border-radius:var(--radius-lg);text-align:center;border:1px dashed var(--color-border);">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-light)" stroke-width="1.5" style="margin-bottom:12px;"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
            <p style="color:var(--color-text-light);font-size:0.85rem;margin-bottom:4px;">Payment gateway integration ready</p>
            <p style="color:var(--color-text-light);font-size:0.75rem;">Supports PayFast, Yoco, or Stripe</p>
          </div>-->

          <!-- Newsletter Opt-In -->
          <label class="newsletter-optin" id="newsletter-optin-label" style="display:flex;align-items:flex-start;gap:12px;padding:16px 20px;background:var(--color-bg-alt);border:1px solid var(--color-border-light);border-radius:var(--radius-lg);margin:24px 0;cursor:pointer;">
            <input type="checkbox" id="newsletter-optin" name="newsletter-optin" checked
              style="margin-top:3px;accent-color:var(--color-gold);width:15px;height:15px;flex-shrink:0;">
            <span style="font-size:0.82rem;color:var(--color-text-light);line-height:1.6;">
              <strong style="display:block;color:var(--color-text);font-size:0.85rem;margin-bottom:2px;">Join the O'luhle Circle</strong>
              Receive new arrivals, exclusive offers, and fragrance stories. Unsubscribe at any time.
            </span>
          </label>

          <button class="btn btn--primary btn--full btn--lg mt-md" id="place-order-btn" type="button">
            Place Order
          </button>
          <p id="checkout-error" style="display:none;color:#c0392b;font-size:0.82rem;margin-top:12px;text-align:center;"></p>
        </div>

        <!-- Order Summary Sidebar -->
        <div>
          <div class="cart-summary">
            <h3>Order Summary</h3>
            <div class="checkout-items" id="checkout-items"></div>
            <div class="cart-summary__row" style="margin-top:16px;padding-top:16px;border-top:1px solid var(--color-border-light);">
              <span>Subtotal</span>
              <span class="checkout-subtotal">R0</span>
            </div>
            <div class="cart-summary__row">
              <span>Shipping</span>
              <span class="checkout-shipping-val">R99</span>
            </div>
            <div class="cart-summary__row cart-summary__row--total">
              <span>Total</span>
              <span class="checkout-total">R0</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Minimal Footer -->
  <footer style="padding:32px 0;text-align:center;color:var(--color-text-light);font-size:0.75rem;border-top:1px solid var(--color-border-light);">
    <div class="container">
      <p>&copy; 2026 O'luhle Scents · <a href="tel:0761112096" style="color:var(--color-gold);">076 111 2096</a> <br> <button class="checkout-footer-legal js-open-legal">Legal &amp; More</button>  ·  <button class="checkout-footer-legal js-open-cookies">Cookie Settings</button></p>
      <p style="margin-top:6px;opacity:0.6;">Site by <a href="https://culchar.co.za" target="_blank" rel="noopener noreferrer" style="color:var(--color-gold-dark);text-decoration:none;">Cul.Char</a></p>
    </div>
  </footer>

  <script type="module" src="js/app.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/cookie-consent.js"></script>
  <script type="module">
    import { createOrder } from './js/api.js';
    import { trackBeginCheckout } from './js/analytics.js';

    function getPlaceholderImage(name) {
      const initials = name.split(' ').map(w => w[0]).join('').substring(0, 2);
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="520" viewBox="0 0 400 520">
        <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f2ede7"/><stop offset="100%" stop-color="#e8e0d4"/></linearGradient></defs>
        <rect width="400" height="520" fill="url(#bg)"/>
        <text x="200" y="240" text-anchor="middle" font-family="serif" font-size="48" fill="#b89b6a" opacity="0.5">${initials}</text>
      </svg>`;
      return `data:image/svg+xml,${encodeURIComponent(svg)}`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      let cart = JSON.parse(localStorage.getItem('oluhle_cart') || '[]');
      if (cart.length > 0) trackBeginCheckout(cart);
      const itemsContainer = document.getElementById('checkout-items');

      // --- Render order summary ---
      function renderCheckoutItems() {
        if (!itemsContainer) return;

        if (cart.length === 0) {
          itemsContainer.innerHTML = `
            <div style="text-align:center;padding:40px 0;">
              <p style="color:var(--color-text-light);font-size:0.85rem;margin-bottom:16px;">Your cart is empty.</p>
              <a href="shop.html" class="btn btn--outline-dark btn--sm">Return to Shop</a>
            </div>`;
          // Hide checkout form if cart is empty
          const checkoutGrid = document.querySelector('.checkout-grid');
          if (checkoutGrid) {
            // Optional: You might want to hide the form or just disable the button
            // document.getElementById('place-order-btn').disabled = true;
          }
        } else {
          itemsContainer.innerHTML = cart.map((item, index) => `
            <div style="display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--color-border-light);position:relative;">
              <div style="width:56px;height:70px;border-radius:var(--radius);overflow:hidden;background:var(--color-bg-alt);flex-shrink:0;position:relative;">
                <img src="${item.image ? 'images/' + item.image : getPlaceholderImage(item.name)}" alt="${item.name}" style="width:100%;height:100%;object-fit:cover;" onerror="this.src='${getPlaceholderImage(item.name)}'">
                <span style="position:absolute;top:-4px;right:-4px;width:20px;height:20px;background:var(--color-gold);color:#fff;border-radius:50%;font-size:0.6rem;display:flex;align-items:center;justify-content:center;font-weight:600;">${item.qty || item.quantity}</span>
              </div>
              <div style="flex:1;">
                <div style="font-family:var(--font-display);font-weight:500;">${item.name}</div>
                <div style="font-size:0.72rem;color:var(--color-text-light);">${item.size}</div>
                <button type="button" class="js-remove-item" data-variant="${item.variantId}" style="background:none;border:none;padding:0;color:#d9534f;font-size:0.65rem;text-decoration:underline;cursor:pointer;margin-top:4px;letter-spacing:0.05em;">Remove</button>
              </div>
              <div style="font-weight:500;font-size:0.85rem;">R${((parseFloat(item.price) || 0) * (parseInt(item.qty || item.quantity) || 0)).toLocaleString()}</div>
            </div>
          `).join('');

          // Add click listeners to remove buttons
          document.querySelectorAll('.js-remove-item').forEach(btn => {
            btn.addEventListener('click', (e) => {
              const variantId = e.target.dataset.variant;
              removeItem(variantId);
            });
          });

        }
        updateSummaryTotals();
      }

      function removeItem(variantId) {
        cart = cart.filter(item => item.variantId !== variantId);
        localStorage.setItem('oluhle_cart', JSON.stringify(cart));
        renderCheckoutItems();
      }

      // --- Dynamic Shipping Calculation ---
      let shippingCost = 0;

      // Initialize shipping cost based on the default selection
      const initialRadio = document.querySelector('input[name="shipping"]:checked');
      if (initialRadio) {
        shippingCost = parseFloat(initialRadio.value) || 0;
      }

      // Update when a radio button is manually clicked
      document.querySelectorAll('input[name="shipping"]').forEach(radio => {
        radio.addEventListener('change', (e) => {
          shippingCost = parseFloat(e.target.value) || 0;
          updateSummaryTotals();
        });
      });

      async function updateShippingEstimate() {
        const postal = document.getElementById('postal').value.trim();
        const province = document.getElementById('province').value;
        const subtotal = cart.reduce((s, i) => s + (parseFloat(i.price) * (i.qty || i.quantity)), 0);

        if (postal && province) {
          try {
            const { cost } = await getShippingEstimate('South Africa', postal, subtotal);
            
            // Standard is the base cost
            const standardRadio = document.getElementById('shipping-standard');
            const expressRadio = document.getElementById('shipping-express');
            
            if (standardRadio) {
              standardRadio.value = cost;
              const priceSpan = standardRadio.closest('label').querySelector('.method-price');
              if (priceSpan) priceSpan.textContent = cost === 0 ? 'FREE' : `R${cost.toLocaleString()}`;
            }
            
            if (expressRadio) {
              // Express is base + 100 as a business rule
              const expressCost = cost + 100;
              expressRadio.value = expressCost;
              const priceSpan = expressRadio.closest('label').querySelector('.method-price');
              if (priceSpan) priceSpan.textContent = `R${expressCost.toLocaleString()}`;
            }

            // Update shippingCost based on the CURRENTLY selected radio
            const selectedRadio = document.querySelector('input[name="shipping"]:checked');
            if (selectedRadio) {
              shippingCost = parseFloat(selectedRadio.value) || 0;
            }
            
            updateSummaryTotals();
          } catch (err) {
            console.error('Shipping estimate failed', err);
          }
        }
      }

      function updateSummaryTotals() {
        const subtotal = cart.reduce((s, i) => {
          const itemPrice = parseFloat(i.price) || 0;
          const itemQty   = parseInt(i.qty || i.quantity) || 0;
          return s + (itemPrice * itemQty);
        }, 0);
        
        const subtotalEl = document.querySelector('.checkout-subtotal');
        const totalEl    = document.querySelector('.checkout-total');
        const shippingEl = document.querySelector('.checkout-shipping-val');

        if (subtotalEl) subtotalEl.textContent = `R${subtotal.toLocaleString()}`;
        if (shippingEl) shippingEl.textContent = `R${shippingCost.toLocaleString()}`;
        if (totalEl)    totalEl.textContent    = `R${(subtotal + shippingCost).toLocaleString()}`;
      }

      renderCheckoutItems();
      document.getElementById('postal')?.addEventListener('blur', updateShippingEstimate);
      document.getElementById('province')?.addEventListener('change', updateShippingEstimate);


      // --- Place Order ---
      document.getElementById('place-order-btn').addEventListener('click', async () => {
        const errorEl = document.getElementById('checkout-error');
        const btn     = document.getElementById('place-order-btn');
        errorEl.style.display = 'none';

        if (cart.length === 0) {
          errorEl.textContent = 'Your cart is empty.';
          errorEl.style.display = 'block';
          return;
        }

        const email    = document.getElementById('email').value.trim();
        const phone    = document.getElementById('phone').value.trim();
        const firstName = document.getElementById('first-name').value.trim();
        const lastName  = document.getElementById('last-name').value.trim();
        const street    = document.getElementById('address').value.trim();
        const city      = document.getElementById('city').value.trim();
        const province  = document.getElementById('province').value;
        const postalCode = document.getElementById('postal').value.trim();

        if (!email || !phone || !firstName || !lastName || !street || !city || !province || !postalCode) {
          errorEl.textContent = 'Please fill in all required fields.';
          errorEl.style.display = 'block';
          return;
        }

        const selectedRadio = document.querySelector('input[name="shipping"]:checked');
        const shippingMethod = selectedRadio ? selectedRadio.getAttribute('data-name') : 'Standard Delivery';

        btn.disabled = true;
        btn.textContent = 'Processing…';

        try {
          const newsletterOptIn = document.getElementById('newsletter-optin')?.checked || false
          const data = await createOrder({
            items: cart.map(i => ({ variantId: i.variantId, quantity: parseInt(i.qty || i.quantity) })),
            contact: { email, phone },
            shipping: { firstName, lastName, street, city, province, postalCode, country: 'South Africa' },
            shippingMethod,
            newsletterOptIn,
          });


          // Logic for clearing cart: 
          // We clear it here because the user is successfully handing off to PayFast.
          localStorage.removeItem('oluhle_cart');

          // Submit to PayFast via a hidden auto-submitting form
          const form = document.createElement('form');
          form.method = 'POST';
          form.action = data.payfastUrl;
          
          for (const [key, value] of Object.entries(data.payfastData)) {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = key;
            input.value = value;
            form.appendChild(input);
          }
          
          document.body.appendChild(form);
          form.submit();

        } catch (err) {
          console.error('Order failed:', err);
          errorEl.textContent = err.message || 'Something went wrong. Please check your connection and try again.';
          errorEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Place Order';
        }
      });
    });
  </script>
</body>
</html>
