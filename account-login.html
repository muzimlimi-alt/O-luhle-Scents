<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Sign In | TOCA</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/modern-extensions.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
  <script>(function(){try{var t=JSON.parse(localStorage.getItem('toca_admin_prefs')||'{}').theme;if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script>
  <style>
    .account-page { padding-top: 140px; padding-bottom: 80px; min-height: 70vh; }
    .account-form-card { max-width: 400px; margin: 0 auto; }
    .account-form-card h2 { text-align: center; margin-bottom: 8px; }
    .account-form-card__subtitle { text-align: center; color: var(--color-text-light); font-size: 0.85rem; margin-bottom: 32px; }
    .account-form-links { text-align: center; margin-top: 20px; font-size: 0.82rem; color: var(--color-text-light); }
    .account-form-links a { color: var(--color-gold); text-decoration: none; }
  </style>
</head>
<body>

  <div class="page-loader"><div class="loader-spinner"></div></div>

  <header class="header">
    <nav class="navbar">
      <div class="navbar__left">
        <a href="index.html" style="font-size:0.78rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-text-light);">← Home</a>
      </div>
      <a href="index.html" class="navbar__logo">TOCA</a>
      <div class="navbar__right"></div>
    </nav>
  </header>

  <section class="section account-page">
    <div class="container">
      <div class="account-form-card">
        <h2>Sign In</h2>
        <p class="account-form-card__subtitle">Access your order history and manage your EFT payments.</p>

        <form id="login-form">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required>
          </div>
          <button class="btn btn--primary btn--full btn--lg mt-md" type="submit" id="login-btn">Sign In</button>
          <p id="login-error" style="display:none;color:#c0392b;font-size:0.82rem;margin-top:12px;text-align:center;"></p>
        </form>

        <p class="account-form-links">
          <a href="account-forgot-password.html">Forgot your password?</a><br><br>
          Don't have an account? <a href="account-register.html">Create one</a>
        </p>
      </div>
    </div>
  </section>

  <footer style="padding:32px 0;text-align:center;color:var(--color-text-light);font-size:0.75rem;border-top:1px solid var(--color-border-light);">
    <div class="container">
      <p>&copy; 2026 TOCA (Pty) Ltd · <a href="tel:0761112096" style="color:var(--color-gold);">076 111 2096</a></p>
    </div>
  </footer>

  <script src="js/footer.js"></script>
  <script src="js/cookie-consent.js"></script>
  <script type="module">
    import { loginCustomer } from './js/api.js';

    document.querySelector('.page-loader')?.classList.add('hidden');

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errorEl = document.getElementById('login-error');
      errorEl.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.textContent = 'Signing in…';
      try {
        await loginCustomer(email, password);
        const params = new URLSearchParams(window.location.search);
        window.location.href = params.get('redirect') || 'account.html';
      } catch (err) {
        errorEl.textContent = err.message || 'Invalid email or password.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
