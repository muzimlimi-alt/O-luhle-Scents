<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | O'luhle Scents</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/modern-extensions.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
  <script>(function(){try{var t=JSON.parse(localStorage.getItem('oluhle_admin_prefs')||'{}').theme;if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script>
  <style>
    .account-page { padding-top: 140px; padding-bottom: 80px; min-height: 70vh; }
    .account-form-card { max-width: 400px; margin: 0 auto; }
    .account-form-card h2 { text-align: center; margin-bottom: 8px; }
    .account-form-card__subtitle { text-align: center; color: var(--color-text-light); font-size: 0.85rem; margin-bottom: 32px; }
    .account-form-links { text-align: center; margin-top: 20px; font-size: 0.82rem; color: var(--color-text-light); }
    .account-form-links a { color: var(--color-gold); text-decoration: none; }
  </style>
</head>
<body>

  <div class="page-loader"><div class="loader-spinner"></div></div>

  <header class="header">
    <nav class="navbar">
      <div class="navbar__left">
        <a href="account-login.html" style="font-size:0.78rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-text-light);">← Sign In</a>
      </div>
      <a href="index.html" class="navbar__logo">O'luhle <em>Scents</em></a>
      <div class="navbar__right"></div>
    </nav>
  </header>

  <section class="section account-page">
    <div class="container">
      <div class="account-form-card">
        <h2>Reset Your Password</h2>
        <p class="account-form-card__subtitle">Enter your email and we'll send you a link to reset your password.</p>

        <form id="forgot-form">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required>
          </div>
          <button class="btn btn--primary btn--full btn--lg mt-md" type="submit" id="forgot-btn">Send Reset Link</button>
        </form>
        <p id="forgot-message" style="display:none;font-size:0.85rem;margin-top:16px;text-align:center;color:var(--color-text-light);"></p>

        <p class="account-form-links">
          <a href="account-login.html">Back to Sign In</a>
        </p>
      </div>
    </div>
  </section>

  <footer style="padding:32px 0;text-align:center;color:var(--color-text-light);font-size:0.75rem;border-top:1px solid var(--color-border-light);">
    <div class="container">
      <p>&copy; 2026 O'luhle Scents · <a href="tel:0761112096" style="color:var(--color-gold);">076 111 2096</a></p>
    </div>
  </footer>

  <script src="js/footer.js"></script>
  <script src="js/cookie-consent.js"></script>
  <script type="module">
    import { forgotPassword } from './js/api.js';

    document.querySelector('.page-loader')?.classList.add('hidden');

    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('forgot-btn');
      const messageEl = document.getElementById('forgot-message');
      const email = document.getElementById('email').value.trim();

      btn.disabled = true;
      btn.textContent = 'Sending…';
      try {
        const result = await forgotPassword(email);
        messageEl.textContent = result.message;
        messageEl.style.display = 'block';
        document.getElementById('forgot-form').reset();
      } catch (err) {
        messageEl.textContent = err.message || 'Something went wrong. Please try again.';
        messageEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
