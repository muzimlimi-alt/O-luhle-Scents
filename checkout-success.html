<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — O'luhle Scents</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
</head>
<body>

  <div class="page-loader"><div class="loader-spinner"></div></div>

  <header class="header">
    <nav class="navbar">
      <div class="navbar__left"></div>
      <a href="index.html" class="navbar__logo">O'luhle <em>Scents</em></a>
      <div class="navbar__right"></div>
    </nav>
  </header>

  <section class="section" style="padding-top:140px;padding-bottom:80px;min-height:70vh;display:flex;align-items:center;">
    <div class="container">
      <div style="max-width:560px;margin:0 auto;text-align:center;">

        <!-- Success icon -->
        <div style="width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#b89b6a,#d4af7a);display:flex;align-items:center;justify-content:center;margin:0 auto 28px;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>

        <h2 style="margin-bottom:12px;">Order Confirmed</h2>
        <p style="color:var(--color-text-light);margin-bottom:8px;">
          Thank you for your purchase! Your order has been received and payment confirmed.
        </p>
        <p id="order-ref" style="font-size:0.78rem;color:var(--color-text-light);letter-spacing:0.05em;margin-bottom:36px;"></p>

        <!-- Order summary -->
        <div id="order-summary" style="background:var(--color-bg-alt);border-radius:var(--radius-lg);padding:24px;margin-bottom:36px;text-align:left;display:none;">
          <h4 style="margin-bottom:16px;font-size:1rem;">Order Summary</h4>
          <div id="order-items"></div>
          <div style="border-top:1px solid var(--color-border-light);margin-top:16px;padding-top:16px;">
            <div style="display:flex;justify-content:space-between;font-size:0.85rem;margin-bottom:6px;">
              <span style="color:var(--color-text-light);">Subtotal</span>
              <span id="order-subtotal"></span>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:0.85rem;margin-bottom:6px;">
              <span style="color:var(--color-text-light);">Shipping</span>
              <span id="order-shipping"></span>
            </div>
            <div style="display:flex;justify-content:space-between;font-weight:600;margin-top:8px;">
              <span>Total</span>
              <span id="order-total"></span>
            </div>
          </div>
        </div>

        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
          <a href="shop.html" class="btn btn--primary">Continue Shopping</a>
          <a href="index.html" class="btn btn--outline-dark">Back to Home</a>
        </div>
      </div>
    </div>
  </section>

  <footer style="padding:32px 0;text-align:center;color:var(--color-text-light);font-size:0.75rem;border-top:1px solid var(--color-border-light);">
    <div class="container">
      <p>&copy; 2026 O'luhle Scents · <a href="tel:0761112096" style="color:var(--color-gold);">076 111 2096</a></p>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script>
    const API_URL = 'http://localhost:3000';

    document.addEventListener('DOMContentLoaded', async () => {
      hideLoader();
      const params = new URLSearchParams(window.location.search);
      const orderId = params.get('order');

      if (!orderId) return;

      document.getElementById('order-ref').textContent = `Order reference: ${orderId}`;

      try {
        const res = await fetch(`${API_URL}/api/orders/${orderId}`);
        if (!res.ok) return;
        const order = await res.json();

        const summaryEl = document.getElementById('order-summary');
        const itemsEl   = document.getElementById('order-items');

        itemsEl.innerHTML = order.items.map(item => `
          <div style="display:flex;justify-content:space-between;font-size:0.85rem;padding:6px 0;border-bottom:1px solid var(--color-border-light);">
            <span>${item.product.name} <span style="color:var(--color-text-light);">${item.size} × ${item.qty}</span></span>
            <span>R${(item.unitPrice * item.qty).toLocaleString()}</span>
          </div>
        `).join('');

        document.getElementById('order-subtotal').textContent = `R${order.subtotal.toLocaleString()}`;
        document.getElementById('order-shipping').textContent = `R${order.shippingCost.toLocaleString()}`;
        document.getElementById('order-total').textContent    = `R${order.total.toLocaleString()}`;
        summaryEl.style.display = 'block';
      } catch {
        // Summary is optional — silently skip if API is unreachable
      }
    });
  </script>
</body>
</html>
