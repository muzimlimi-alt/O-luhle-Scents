<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed | O'luhle Scents</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/modern-extensions.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
  <script>(function(){try{var t=JSON.parse(localStorage.getItem('oluhle_admin_prefs')||'{}').theme;if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script>
</head>
<body>

  <div class="page-loader"><div class="loader-spinner"></div></div>

  <header class="header">
    <nav class="navbar">
      <div class="navbar__left"></div>
      <a href="index.html" class="navbar__logo">O'luhle <em>Scents</em></a>
      <div class="navbar__right"></div>
    </nav>
  </header>

  <section class="section" style="padding-top:140px;padding-bottom:80px;min-height:70vh;display:flex;align-items:center;">
    <div class="container">
      <div style="max-width:560px;margin:0 auto;text-align:center;">

        <!-- Success icon -->
        <div style="width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#b89b6a,#d4af7a);display:flex;align-items:center;justify-content:center;margin:0 auto 28px;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>

        <h2 style="margin-bottom:12px;">Order Confirmed</h2>
        <p style="color:var(--color-text-light);margin-bottom:8px;">
          Thank you for your purchase! Your order has been received and payment confirmed.
        </p>
        <p id="order-ref" style="font-size:0.78rem;color:var(--color-text-light);letter-spacing:0.05em;margin-bottom:36px;"></p>

        <!-- Order summary -->
        <div id="order-summary" style="background:var(--color-bg-alt);border-radius:var(--radius-lg);padding:24px;margin-bottom:36px;text-align:left;display:none;">
          <h4 style="margin-bottom:16px;font-size:1rem;">Order Summary</h4>
          <div id="order-items"></div>
          <div style="border-top:1px solid var(--color-border-light);margin-top:16px;padding-top:16px;">
            <div style="display:flex;justify-content:space-between;font-size:0.85rem;margin-bottom:6px;">
              <span style="color:var(--color-text-light);">Subtotal</span>
              <span id="order-subtotal"></span>
            </div>
            <div id="order-discount-row" style="display:none;justify-content:space-between;font-size:0.85rem;margin-bottom:6px;color:#2e7d32;">
              <span>Discount<span id="order-coupon-code"></span></span>
              <span id="order-discount"></span>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:0.85rem;margin-bottom:6px;">
              <span style="color:var(--color-text-light);">Shipping</span>
              <span id="order-shipping"></span>
            </div>
            <div id="order-tax-row" style="display:none;justify-content:space-between;font-size:0.85rem;margin-bottom:6px;">
              <span id="order-tax-label" style="color:var(--color-text-light);">Tax</span>
              <span id="order-tax"></span>
            </div>
            <div style="display:flex;justify-content:space-between;font-weight:600;margin-top:8px;">
              <span>Total</span>
              <span id="order-total"></span>
            </div>
          </div>
        </div>

        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
          <a href="shop.html" class="btn btn--primary">Continue Shopping</a>
          <a href="index.html" class="btn btn--outline-dark">Back to Home</a>
        </div>
      </div>
    </div>
  </section>

  <footer style="padding:32px 0;text-align:center;color:var(--color-text-light);font-size:0.75rem;border-top:1px solid var(--color-border-light);">
    <div class="container">
      <p>&copy; 2026 O'luhle Scents · <a href="tel:0761112096" style="color:var(--color-gold);">076 111 2096</a> · <button class="checkout-footer-legal js-open-legal">Legal &amp; More</button> · <button class="checkout-footer-legal js-open-cookies">Cookie Settings</button></p>
      <p style="margin-top:6px;opacity:0.6;">Site by <a href="https://culchar.co.za" target="_blank" rel="noopener noreferrer" style="color:var(--color-gold-dark);text-decoration:none;">Cul.Char</a></p>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/cookie-consent.js"></script>
  <script type="module">
    import { getOrder } from './js/api.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const orderId = params.get('order');

      if (!orderId) {
        document.querySelector('.page-loader')?.classList.add('hidden');
        return;
      }

      const refEl = document.getElementById('order-ref');
      if (refEl) refEl.textContent = `Order reference: ${orderId}`;

      try {
        const order = await getOrder(orderId);
        
        const summaryEl = document.getElementById('order-summary');
        const itemsEl   = document.getElementById('order-items');

        if (itemsEl && order.items) {
          itemsEl.innerHTML = order.items.map(item => `
            <div style="display:flex;justify-content:space-between;font-size:0.85rem;padding:8px 0;border-bottom:1px solid var(--color-border-light);">
              <span>${item.variant?.product?.name || 'Scent'} <span style="color:var(--color-text-light);font-size:0.75rem;">(${item.variant?.size || 'Standard'} × ${item.quantity})</span></span>
              <span>R${(parseFloat(item.priceAtPurchase) * item.quantity).toLocaleString()}</span>
            </div>
          `).join('');
        }

        const subtotal = (order.items || []).reduce((s, item) => s + parseFloat(item.priceAtPurchase) * item.quantity, 0);
        const discountAmount = parseFloat(order.discountAmount) || 0;
        const taxAmount = parseFloat(order.taxAmount) || 0;

        const subtotalEl    = document.getElementById('order-subtotal');
        const shippingEl    = document.getElementById('order-shipping');
        const totalEl       = document.getElementById('order-total');
        const discountRowEl = document.getElementById('order-discount-row');
        const discountEl    = document.getElementById('order-discount');
        const couponCodeEl  = document.getElementById('order-coupon-code');
        const taxRowEl      = document.getElementById('order-tax-row');
        const taxEl         = document.getElementById('order-tax');
        const taxLabelEl    = document.getElementById('order-tax-label');

        if (subtotalEl) subtotalEl.textContent = `R${subtotal.toLocaleString()}`;
        if (shippingEl) shippingEl.textContent = `R${parseFloat(order.shippingCost).toLocaleString()}`;
        if (totalEl)    totalEl.textContent    = `R${parseFloat(order.totalAmount).toLocaleString()}`;

        if (discountAmount > 0) {
          if (discountRowEl) discountRowEl.style.display = 'flex';
          if (discountEl) discountEl.textContent = `-R${discountAmount.toLocaleString()}`;
          if (couponCodeEl && order.coupon?.code) couponCodeEl.textContent = ` (${order.coupon.code})`;
        }

        if (taxAmount > 0) {
          if (taxRowEl) taxRowEl.style.display = 'flex';
          if (taxEl) taxEl.textContent = `R${taxAmount.toLocaleString()}`;
          if (taxLabelEl && order.taxRate?.name) taxLabelEl.textContent = `Tax (${order.taxRate.name})`;
        }

        if (summaryEl) summaryEl.style.display = 'block';
      } catch (err) {
        console.error('[Success Page] Error loading order:', err);
      } finally {
        document.querySelector('.page-loader')?.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
