<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account | O'luhle Scents</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/modern-extensions.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
  <script>(function(){try{var t=JSON.parse(localStorage.getItem('oluhle_admin_prefs')||'{}').theme;if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script>
  <style>
    .account-page { padding-top: 140px; padding-bottom: 80px; min-height: 70vh; }
    .account-layout { display: grid; grid-template-columns: 220px 1fr; gap: 40px; max-width: 960px; margin: 0 auto; align-items: start; }
    .account-nav { display: flex; flex-direction: column; gap: 4px; border-right: 1px solid var(--color-border-light); padding-right: 24px; }
    .account-nav button {
      background: none; border: none; text-align: left; padding: 10px 12px; font-size: 0.88rem; color: var(--color-text-light);
      cursor: pointer; border-radius: var(--radius); font-family: inherit;
    }
    .account-nav button.active { background: var(--color-bg-alt); color: var(--color-text); font-weight: 500; }
    .account-nav button.logout { color: #c0392b; margin-top: 16px; }

    .account-tab { display: none; }
    .account-tab.active { display: block; }
    .account-tab h2 { margin-bottom: 24px; font-size: 1.4rem; }

    .order-card { border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; }
    .order-card__header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .order-card__number { font-weight: 600; font-family: monospace; }
    .order-card__meta { font-size: 0.78rem; color: var(--color-text-light); }
    .order-status-pill { display: inline-block; font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 10px; border-radius: 20px; background: var(--color-bg-alt); color: var(--color-text-light); }
    .order-card__items { font-size: 0.85rem; color: var(--color-text-light); margin-bottom: 12px; }
    .order-card__detail { display: none; border-top: 1px solid var(--color-border-light); padding-top: 16px; margin-top: 8px; }
    .order-card__detail.open { display: block; }
    .order-card__toggle { background: none; border: none; color: var(--color-gold); font-size: 0.8rem; cursor: pointer; padding: 0; font-family: inherit; }

    .address-card { border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 16px 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .address-card__text { font-size: 0.85rem; line-height: 1.6; }
    .address-card__actions { display: flex; gap: 8px; flex-shrink: 0; }
    .address-card__actions button { background: none; border: none; color: var(--color-text-light); cursor: pointer; font-size: 0.78rem; text-decoration: underline; }

    @media (max-width: 720px) {
      .account-layout { grid-template-columns: 1fr; }
      .account-nav { flex-direction: row; flex-wrap: wrap; border-right: none; border-bottom: 1px solid var(--color-border-light); padding-right: 0; padding-bottom: 16px; }
    }
  </style>
</head>
<body>

  <div class="page-loader"><div class="loader-spinner"></div></div>

  <header class="header">
    <nav class="navbar">
      <div class="navbar__left">
        <a href="index.html" style="font-size:0.78rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-text-light);">← Home</a>
      </div>
      <a href="index.html" class="navbar__logo">O'luhle <em>Scents</em></a>
      <div class="navbar__right"></div>
    </nav>
  </header>

  <section class="section account-page">
    <div class="container">
      <h1 style="text-align:center;margin-bottom:48px;">My Account</h1>

      <div class="account-layout">
        <nav class="account-nav">
          <button data-tab="orders" class="active">Order History</button>
          <button data-tab="addresses">Addresses</button>
          <button data-tab="profile">Profile</button>
          <button class="logout" id="logout-btn">Sign Out</button>
        </nav>

        <div class="account-content">
          <div class="account-tab active" id="tab-orders">
            <h2>Order History</h2>
            <div id="orders-list"><p style="color:var(--color-text-light);font-size:0.85rem;">Loading your orders…</p></div>
          </div>

          <div class="account-tab" id="tab-addresses">
            <h2>Saved Addresses</h2>
            <div id="addresses-list"></div>
            <button class="btn btn--outline-dark btn--sm" id="add-address-btn" style="margin-top:12px;">+ Add Address</button>
            <form id="address-form" style="display:none;margin-top:20px;border-top:1px solid var(--color-border-light);padding-top:20px;">
              <input type="hidden" id="address-id">
              <div class="form-group"><label>Street Address</label><input type="text" id="address-street" required></div>
              <div class="form-row">
                <div class="form-group"><label>City</label><input type="text" id="address-city" required></div>
                <div class="form-group"><label>Province</label><input type="text" id="address-province" required></div>
              </div>
              <div class="form-row">
                <div class="form-group"><label>Postal Code</label><input type="text" id="address-postal" required></div>
                <div class="form-group"><label>Country</label><input type="text" id="address-country" value="South Africa"></div>
              </div>
              <div style="display:flex;gap:12px;">
                <button type="submit" class="btn btn--primary btn--sm">Save Address</button>
                <button type="button" class="btn btn--outline-dark btn--sm" id="cancel-address-btn">Cancel</button>
              </div>
            </form>
          </div>

          <div class="account-tab" id="tab-profile">
            <h2>Profile</h2>
            <form id="profile-form">
              <div class="form-group"><label>Email</label><input type="email" id="profile-email" disabled></div>
              <div class="form-group"><label>Full Name</label><input type="text" id="profile-name"></div>
              <div class="form-group"><label>Phone</label><input type="tel" id="profile-phone"></div>
              <button type="submit" class="btn btn--primary btn--sm">Save Changes</button>
              <p id="profile-message" style="display:none;font-size:0.82rem;margin-top:12px;color:var(--color-text-light);"></p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer style="padding:32px 0;text-align:center;color:var(--color-text-light);font-size:0.75rem;border-top:1px solid var(--color-border-light);">
    <div class="container">
      <p>&copy; 2026 O'luhle Scents · <a href="tel:0761112096" style="color:var(--color-gold);">076 111 2096</a></p>
    </div>
  </footer>

  <script src="js/footer.js"></script>
  <script src="js/cookie-consent.js"></script>
  <script type="module">
    import {
      getToken, logout, getMyProfile, updateMyProfile,
      getMyAddresses, createMyAddress, updateMyAddress, deleteMyAddress,
      getMyOrders, getMyOrder, uploadMyOrderProof,
    } from './js/api.js';
    import { renderEftProofWidget } from './js/eft-proof-upload.js';

    if (!getToken()) {
      window.location.href = `account-login.html?redirect=${encodeURIComponent('account.html')}`;
    }

    document.querySelector('.page-loader')?.classList.add('hidden');

    // --- Tab switching ---
    document.querySelectorAll('.account-nav button[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.account-nav button[data-tab]').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.account-tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
      });
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      logout();
      window.location.href = 'index.html';
    });

    // --- Orders ---
    async function loadOrders() {
      const listEl = document.getElementById('orders-list');
      try {
        const orders = await getMyOrders();
        if (!orders.length) {
          listEl.innerHTML = `<p style="color:var(--color-text-light);font-size:0.85rem;">You haven't placed any orders yet. <a href="shop.html" style="color:var(--color-gold);">Start shopping →</a></p>`;
          return;
        }
        listEl.innerHTML = orders.map(order => {
          // Active EFT payment — for a deposit order this is the deposit
          // until it's verified, then the balance (Partial Payments phase).
          const eftPayment = order.payments?.find(p => p.paymentMethod === 'manual_eft' && ['PENDING_PROOF', 'PROOF_UPLOADED', 'REJECTED'].includes(p.eftVerificationStatus));
          return `
            <div class="order-card" data-order-id="${order.id}">
              <div class="order-card__header">
                <span class="order-card__number">${order.orderNumber}</span>
                <span class="order-status-pill">${order.status}</span>
              </div>
              <div class="order-card__meta">${new Date(order.createdAt).toLocaleDateString()} · R${Number(order.totalAmount).toLocaleString()}</div>
              <div class="order-card__items">${order.items.length} item(s)${eftPayment ? ` · EFT: ${eftPayment.eftVerificationStatus?.replace('_', ' ') || ''}` : ''}</div>
              <button class="order-card__toggle" data-toggle="${order.id}">View Details</button>
              <div class="order-card__detail" id="detail-${order.id}"></div>
            </div>`;
        }).join('');

        listEl.querySelectorAll('.order-card__toggle').forEach(btn => {
          btn.addEventListener('click', () => toggleOrderDetail(btn.dataset.toggle, btn));
        });
      } catch (err) {
        listEl.innerHTML = `<p style="color:#c0392b;font-size:0.85rem;">Failed to load orders: ${err.message}</p>`;
      }
    }

    async function toggleOrderDetail(orderId, btn) {
      const detailEl = document.getElementById(`detail-${orderId}`);
      const isOpen = detailEl.classList.contains('open');
      if (isOpen) {
        detailEl.classList.remove('open');
        btn.textContent = 'View Details';
        return;
      }

      btn.textContent = 'Hide Details';
      detailEl.classList.add('open');
      if (detailEl.dataset.loaded) return;

      const order = await getMyOrder(orderId);
      const itemsHtml = order.items.map(item => `
        <div style="display:flex;justify-content:space-between;font-size:0.82rem;padding:6px 0;border-bottom:1px solid var(--color-border-light);">
          <span>${item.productNameSnapshot || item.variant?.product?.name} (${item.variantLabelSnapshot || item.variant?.size}) × ${item.quantity}</span>
          <span>R${(Number(item.priceAtPurchase) * item.quantity).toLocaleString()}</span>
        </div>`).join('');

      detailEl.innerHTML = `<div class="order-items-detail">${itemsHtml}</div><p class="eft-amount-due-note" style="display:none;font-size:0.82rem;margin:10px 0 0;"></p><div class="eft-widget-slot"></div>`;

      // Active EFT payment — see loadOrders() above for why this can't just
      // take payments[0] once a deposit order has a second (balance) row.
      const eftPayment = order.payments?.find(p => p.paymentMethod === 'manual_eft' && ['PENDING_PROOF', 'PROOF_UPLOADED', 'REJECTED'].includes(p.eftVerificationStatus));
      if (eftPayment) {
        const noteEl = detailEl.querySelector('.eft-amount-due-note');
        if (noteEl) {
          noteEl.style.display = 'block';
          noteEl.textContent = `Amount due now: R${Number(eftPayment.amount).toLocaleString()}`;
        }
        renderEftProofWidget(detailEl.querySelector('.eft-widget-slot'), {
          orderId: order.id,
          eftVerificationStatus: eftPayment.eftVerificationStatus,
          rejectionReason: eftPayment.rejectionReason,
          uploadFn: uploadMyOrderProof,
          onUploaded: (status) => {
            renderEftProofWidget(detailEl.querySelector('.eft-widget-slot'), {
              orderId: order.id, eftVerificationStatus: status, rejectionReason: null, uploadFn: uploadMyOrderProof,
            });
          },
        });
      }

      detailEl.dataset.loaded = 'true';
    }

    // --- Addresses ---
    async function loadAddresses() {
      const listEl = document.getElementById('addresses-list');
      try {
        const addresses = await getMyAddresses();
        if (!addresses.length) {
          listEl.innerHTML = `<p style="color:var(--color-text-light);font-size:0.85rem;">No saved addresses yet.</p>`;
          return;
        }
        listEl.innerHTML = addresses.map(addr => `
          <div class="address-card" data-id="${addr.id}">
            <div class="address-card__text">
              ${addr.street}<br>${addr.city}, ${addr.province} ${addr.postalCode}<br>${addr.country}
              ${addr.isDefault ? '<br><em style="color:var(--color-gold);">Default</em>' : ''}
            </div>
            <div class="address-card__actions">
              <button data-edit="${addr.id}">Edit</button>
              <button data-delete="${addr.id}">Delete</button>
            </div>
          </div>`).join('');

        listEl.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => editAddress(addresses.find(a => a.id === btn.dataset.edit))));
        listEl.querySelectorAll('[data-delete]').forEach(btn => btn.addEventListener('click', () => removeAddress(btn.dataset.delete)));
      } catch (err) {
        listEl.innerHTML = `<p style="color:#c0392b;font-size:0.85rem;">Failed to load addresses: ${err.message}</p>`;
      }
    }

    function showAddressForm() {
      document.getElementById('address-form').style.display = 'block';
      document.getElementById('add-address-btn').style.display = 'none';
    }

    function hideAddressForm() {
      document.getElementById('address-form').reset();
      document.getElementById('address-id').value = '';
      document.getElementById('address-form').style.display = 'none';
      document.getElementById('add-address-btn').style.display = 'inline-block';
    }

    function editAddress(addr) {
      showAddressForm();
      document.getElementById('address-id').value = addr.id;
      document.getElementById('address-street').value = addr.street || '';
      document.getElementById('address-city').value = addr.city || '';
      document.getElementById('address-province').value = addr.province || '';
      document.getElementById('address-postal').value = addr.postalCode || '';
      document.getElementById('address-country').value = addr.country || 'South Africa';
    }

    async function removeAddress(id) {
      if (!confirm('Delete this address?')) return;
      try {
        await deleteMyAddress(id);
        loadAddresses();
      } catch (err) {
        alert(err.message);
      }
    }

    document.getElementById('add-address-btn').addEventListener('click', showAddressForm);
    document.getElementById('cancel-address-btn').addEventListener('click', hideAddressForm);

    document.getElementById('address-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('address-id').value;
      const data = {
        street: document.getElementById('address-street').value.trim(),
        city: document.getElementById('address-city').value.trim(),
        province: document.getElementById('address-province').value.trim(),
        postalCode: document.getElementById('address-postal').value.trim(),
        country: document.getElementById('address-country').value.trim() || 'South Africa',
      };
      try {
        if (id) await updateMyAddress(id, data);
        else await createMyAddress(data);
        hideAddressForm();
        loadAddresses();
      } catch (err) {
        alert(err.message);
      }
    });

    // --- Profile ---
    async function loadProfile() {
      try {
        const profile = await getMyProfile();
        document.getElementById('profile-email').value = profile.email || '';
        document.getElementById('profile-name').value = profile.name || '';
        document.getElementById('profile-phone').value = profile.phone || '';
      } catch (err) {
        console.error('Failed to load profile:', err);
      }
    }

    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const messageEl = document.getElementById('profile-message');
      try {
        await updateMyProfile({
          name: document.getElementById('profile-name').value.trim(),
          phone: document.getElementById('profile-phone').value.trim(),
        });
        messageEl.textContent = 'Profile updated.';
        messageEl.style.display = 'block';
      } catch (err) {
        messageEl.textContent = err.message;
        messageEl.style.display = 'block';
      }
    });

    if (getToken()) {
      loadOrders();
      loadAddresses();
      loadProfile();
    }
  </script>
</body>
</html>
