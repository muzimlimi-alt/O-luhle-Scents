<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Shared Favourites | TOCA</title>
      <link rel="stylesheet" href="css/bootstrap-grid.min.css">
    <link rel="stylesheet" href="css/bootstrap-bridge.css">
    <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/modern-extensions.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
  <style>
    .shared-page { padding-top: 140px; padding-bottom: 80px; min-height: 70vh; }
    .shared-header { text-align: center; margin-bottom: 40px; }
    .shared-header h1 { font-size: 1.6rem; margin-bottom: 8px; }
    .shared-header p { color: var(--color-text-light); font-size: 0.88rem; }
    .shared-empty { text-align: center; color: var(--color-text-light); font-size: 0.9rem; padding: 60px 20px; }
  </style>
</head>
<body>

  <div class="page-loader"><div class="loader-spinner"></div></div>

  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="header__logo"><img src="images/toca-logo.svg" alt="TOCA" height="28" onerror="this.outerHTML='<span style=font-weight:700;font-size:1.2rem>TOCA</span>'"></a>
      <nav class="nav-icons">
        <a href="shop.html" class="btn btn--sm btn--outline-dark">Shop the Collection</a>
      </nav>
    </div>
  </header>

  <section class="shared-page">
    <div class="container">
      <div class="shared-header">
        <h1 id="js-shared-title">Shared Favourites</h1>
        <p id="js-shared-desc"></p>
      </div>
      <div id="js-shared-grid" class="product-grid"></div>
      <div id="js-shared-empty" class="shared-empty" style="display:none;">
        This list is empty or the link may have expired.
      </div>
      <div id="js-shared-error" class="shared-empty" style="display:none;">
        Could not load this shared list. The link may be invalid or expired.
      </div>
    </div>
  </section>

  <footer style="padding:32px 0;text-align:center;color:var(--color-text-light);font-size:0.75rem;border-top:1px solid var(--color-border-light);">
    <div class="container">
      <p>&copy; 2026 TOCA (Pty) Ltd &middot; <a href="tel:0761112096" style="color:var(--color-gold);">076 111 2096</a></p>
    </div>
  </footer>

  <script src="js/footer.js"></script>
  <script>
    (async function () {
      document.querySelector('.page-loader')?.classList.add('hidden');
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      if (!token) {
        document.getElementById('js-shared-error').style.display = '';
        return;
      }
      try {
        const res = await fetch(`/api/wishlist/shared/${encodeURIComponent(token)}`);
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        if (data.name) document.getElementById('js-shared-title').textContent = data.name;
        if (data.description) document.getElementById('js-shared-desc').textContent = data.description;
        const items = data.items || [];
        if (!items.length) { document.getElementById('js-shared-empty').style.display = ''; return; }
        const grid = document.getElementById('js-shared-grid');
        grid.innerHTML = items.map(item => {
          const p = item.product;
          if (!p) return '';
          const variants = (p.variants || []).sort((a, b) => Number(a.price) - Number(b.price));
          const price = variants[0] ? `R${Number(variants[0].price).toLocaleString()}` : '';
          const img = p.primaryImage ? `images/products/${p.primaryImage}` : '';
          return `<div class="product-card reveal">
            <div class="product-card__image">
              <a href="product-detail.html?id=${p.id}"><img src="${img}" alt="${p.name || ''}" onerror="this.style.display='none'"></a>
            </div>
            <div class="product-card__info">
              <h4 class="product-card__name"><a href="product-detail.html?id=${p.id}" style="color:inherit;text-decoration:none;">${p.name || ''}</a></h4>
              <div class="product-card__price">${price}</div>
            </div>
          </div>`;
        }).join('');
      } catch {
        document.getElementById('js-shared-error').style.display = '';
      }
    })();
  </script>
</body>
</html>
